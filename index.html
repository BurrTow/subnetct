<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>subnetctl — IPv4 subnet calculator</title>
  </head>

  <body>
    <div id="app">
      <h1>subnetctl</h1>
      <p>Enter an IPv4 address and a CIDR prefix length to get the subnet breakdown.</p>

      <div class="input-row">
        <label>
          IPv4 address
          <input id="ip" type="text" autocomplete="off" value="192.168.1.10" />
        </label>
        <label>
          Prefix (/)
          <input id="cidr" type="text" autocomplete="off" value="24" />
        </label>
      </div>

      <p id="error" class="error"></p>

      <table>
        <tbody id="results"></tbody>
      </table>

      <footer>built and deployed by GitHub Actions</footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
