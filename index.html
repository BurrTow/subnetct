<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="subnetctl — a fast IPv4 subnet calculator. Enter an address and a CIDR prefix length for the network address, broadcast address, masks and usable host range."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>subnetctl — IPv4 subnet calculator</title>
  </head>

  <body>
    <div id="app">
      <header class="masthead">
        <div class="brand">
          <svg class="brand__mark" viewBox="0 0 64 64" aria-hidden="true">
            <defs>
              <linearGradient id="brandNet" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#22d3ee" />
                <stop offset="1" stop-color="#3b82f6" />
              </linearGradient>
            </defs>
            <rect width="64" height="64" rx="14" fill="#0d131c" />
            <path
              d="M32 23v9M16 32h32M16 32v9M32 32v9M48 32v9"
              fill="none"
              stroke="url(#brandNet)"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
              opacity=".9"
            />
            <circle cx="32" cy="17" r="6" fill="url(#brandNet)" />
            <circle cx="16" cy="47" r="5.5" fill="#22d3ee" />
            <circle cx="32" cy="47" r="5.5" fill="#4ade80" />
            <circle cx="48" cy="47" r="5.5" fill="#3b82f6" />
          </svg>
          <div class="brand__text">
            <h1 class="brand__name">subnetctl</h1>
            <p class="brand__tag">IPv4 subnet breakdown, as you type</p>
          </div>
        </div>
      </header>

      <section class="card card--query">
        <div class="tabs" role="tablist" aria-label="Address family">
          <button
            type="button"
            class="tab"
            role="tab"
            id="tab-v4"
            data-mode="v4"
            aria-selected="true"
            aria-controls="panel-v4"
            tabindex="0"
          >
            IPv4
          </button>
          <button
            type="button"
            class="tab"
            role="tab"
            id="tab-v6"
            data-mode="v6"
            aria-selected="false"
            aria-controls="panel-v6"
            tabindex="-1"
          >
            IPv6
          </button>
        </div>

        <div
          class="fields"
          data-fields="v4"
          id="panel-v4"
          role="tabpanel"
          aria-labelledby="tab-v4"
        >
          <div class="field">
            <label class="field__label" for="ip">IPv4 address</label>
            <div class="field__control">
              <span class="field__glow" aria-hidden="true"></span>
              <input
                id="ip"
                class="field__input mono"
                type="text"
                inputmode="decimal"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                placeholder="192.168.1.10"
              />
            </div>
          </div>

          <div class="field field--cidr">
            <label class="field__label" for="cidr">Prefix length</label>
            <div class="field__control">
              <span class="field__glow" aria-hidden="true"></span>
              <span class="field__slash mono" aria-hidden="true">/</span>
              <input
                id="cidr"
                class="field__input mono"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                spellcheck="false"
                placeholder="24"
                maxlength="2"
              />
            </div>
          </div>
        </div>

        <div
          class="fields fields--single"
          data-fields="v6"
          id="panel-v6"
          role="tabpanel"
          aria-labelledby="tab-v6"
          hidden
        >
          <div class="field">
            <label class="field__label" for="ip6">IPv6 address / prefix</label>
            <div class="field__control">
              <span class="field__glow" aria-hidden="true"></span>
              <input
                id="ip6"
                class="field__input mono"
                type="text"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                placeholder="2001:db8::/32"
              />
            </div>
          </div>
        </div>
      </section>

      <p id="error" class="banner" role="alert" hidden></p>

      <section class="card card--results" id="results-card">
        <span class="card__flash" aria-hidden="true"></span>
        <div class="card__head">
          <h2 class="card__title">Breakdown</h2>
          <div class="card__meta">
            <span id="stale-tag" class="tag" hidden>last valid result</span>
            <code id="summary" class="summary mono"></code>
          </div>
        </div>
        <div id="results" class="results" aria-live="polite"></div>
      </section>

      <footer class="foot">built, tested and deployed by GitHub Actions</footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
